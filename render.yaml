# Blueprint do Render: site estático (SPA) servido pela CDN do Render.
# Troque SEU-BACKEND pela URL real do backend no Render (também na CSP abaixo).
services:
  - type: web
    runtime: static
    name: amor-odonto-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Embutida no bundle durante o build: ex. https://SEU-BACKEND.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
    routes:
      # BrowserRouter: qualquer rota que não seja arquivo cai no index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://SEU-BACKEND.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Arquivos do Vite têm hash no nome: podem ficar em cache para sempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
